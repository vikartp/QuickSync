[project]
name = "quicksync-backend"
version = "2.0.0"
description = "QuickSync Signaling Server — a production-grade FastAPI WebRTC signaling server with MongoDB, Google OAuth, and shareable meeting links."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-dotenv>=1.0.0",
    "motor>=3.5.0",
    "pymongo[srv]>=4.8.0",
    "pyjwt>=2.8.0",
    "httpx>=0.27.0",
]

# Dev server: uv run uvicorn main:app --reload --host 0.0.0.0 --port 8000
