version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quicksync-backend
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=my_secure_secret_123
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quicksync-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
